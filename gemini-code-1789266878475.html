<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Obzue Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="nav-logo">OBZUE ENTERPRISE</a>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop All</a></li>
            <li><a href="hardware.html">Hardware & Machines</a></li>
            <li><a href="downloads.html">Digital Files</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><button class="cart-btn" id="cart-count">Cart (0)</button></li>
        </ul>
    </header>

    <div class="container">
        <h2 class="section-title">Get In Touch</h2>
        <p class="section-subtitle">Questions regarding digital downloads, machine accessories, or custom orders? Reach out below.</p>

        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-brand">OBZUE ENTERPRISE</div>
        <p>&copy; 2024–2026 Obzue Enterprise. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
