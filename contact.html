<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Obzue Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="nav-logo">OBZUE ENTERPRISE</a>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop All</a></li>
            <li><a href="hardware.html">Hardware & Machines</a></li>
            <li><a href="downloads.html">Digital Files</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><button class="cart-btn" id="cart-count" type="button">Cart (0)</button></li>
        </ul>
    </header>
    <div class="container">
        <h2 class="section-title">Get In Touch</h2>
        <p class="section-subtitle">Questions about downloads, machines, or custom orders.</p>
        <div class="contact-form">
            <form id="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="How can we help?"></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
                <p id="form-status" class="form-status" hidden></p>
            </form>
        </div>
    </div>
    <footer>
        <div class="footer-brand">OBZUE ENTERPRISE</div>
        <p>&copy; 2024–2026 Obzue Enterprise. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
